services:
  # docker compose run --rm build   → produces ./dist on the host
  build:
    build: { context: ., target: base }
    command: npm run build
    environment:
      - PUBLIC_TURNSTILE_SITE_KEY=${PUBLIC_TURNSTILE_SITE_KEY:-1x00000000000000000000AA}
    volumes:
      - .:/app
      - /app/node_modules
  # docker compose up dev   → http://localhost:4321
  dev:
    build: { context: ., target: base }
    command: npm run dev -- --host 0.0.0.0
    ports: ["4321:4321"]
    volumes:
      - .:/app
      - /app/node_modules
  # docker compose run --rm deploy   (needs CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID in env)
  deploy:
    build: { context: ., target: base }
    command: npm run deploy
    environment:
      - CLOUDFLARE_API_TOKEN
      - CLOUDFLARE_ACCOUNT_ID
      - PUBLIC_TURNSTILE_SITE_KEY
    volumes:
      - .:/app
      - /app/node_modules
